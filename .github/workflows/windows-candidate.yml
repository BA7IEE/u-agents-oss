name: Windows Candidate

on:
  push:
    branches: [codex/upstream-v0.15.5]
    paths:
      - '.github/workflows/windows-candidate.yml'
      - '.github/scripts/**'
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      U_AGENTS_ALLOW_CODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare isolated configuration before Bun
        run: |
          $profile = Join-Path $env:RUNNER_TEMP 'u-agents-candidate-config'
          $claudeProfile = Join-Path $env:RUNNER_TEMP 'u-agents-candidate-claude'
          New-Item -ItemType Directory -Force $profile, $claudeProfile | Out-Null
          "U_AGENTS_CONFIG_DIR=$profile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CRAFT_CONFIG_DIR=$profile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CLAUDE_CONFIG_DIR=$claudeProfile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - name: Build Windows x64 installer
        run: ./apps/electron/scripts/build-win.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install and verify packaged runtimes
        run: |
          $installer = Resolve-Path 'apps/electron/release/U-Agents-x64.exe'
          $destination = Join-Path $env:RUNNER_TEMP 'u-agents-installed'
          $process = Start-Process $installer -ArgumentList '/S', "/D=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $resources = Join-Path $destination 'resources'
          $app = Join-Path $resources 'app'
          foreach ($relative in @('dist/main.cjs', 'dist/bootstrap-preload.cjs', 'dist/browser-toolbar-preload.cjs', 'dist/interceptor.cjs', 'resources/pi-agent-server/index.js', 'resources/pi-agent-server/node_modules/@silvia-odwyer/photon-node/photon_rs_bg.wasm', 'resources/pi-agent-server/photon_rs_bg.wasm', 'resources/pi-agent-server/node_modules/quickjs-wasi/quickjs.wasm', 'node_modules/@anthropic-ai/claude-agent-sdk/sdk.mjs', 'node_modules/@anthropic-ai/claude-agent-sdk-binary/claude.exe', 'node_modules/@vscode/ripgrep/bin/rg.exe', 'packages/shared/src/config/u-agents-feature-policy.ts')) {
            if (-not (Test-Path (Join-Path $app $relative))) { throw "Missing installed resource: $relative" }
          }
          if (-not (Test-Path "$resources/messaging-whatsapp-worker/worker.cjs")) { throw 'Missing WhatsApp worker' }
          bun .github/scripts/verify-packaged-runtime.ts $app "$resources/vendor/bun/bun.exe" apps/electron/release/RUNTIME-CHECK.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed runtime validation failed' }
          $assetNames = @('U-Agents-x64.exe', 'U-Agents-x64.exe.blockmap', 'latest.yml')
          $hashLines = foreach ($name in $assetNames) {
            $assetPath = Join-Path 'apps/electron/release' $name
            if (-not (Test-Path $assetPath) -or (Get-Item $assetPath).Length -eq 0) { throw "Missing release asset: $name" }
            $hash = (Get-FileHash $assetPath -Algorithm SHA256).Hash.ToLower()
            "$hash  $name"
          }
          $hashLines | Set-Content apps/electron/release/SHA256SUMS.txt
          @("Commit: $env:GITHUB_SHA", "Version: 0.15.5", "Platform: windows-x64", "Run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID", "Built without automatic publication; unsigned", "Real image generation: NOT_RUN (test Token has no image model)") | Set-Content apps/electron/release/BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: U-Agents-0.15.5-windows-x64
          path: |
            apps/electron/release/U-Agents-x64.exe
            apps/electron/release/U-Agents-x64.exe.blockmap
            apps/electron/release/latest.yml
            apps/electron/release/SHA256SUMS.txt
            apps/electron/release/BUILD.txt
            apps/electron/release/RUNTIME-CHECK.json
          if-no-files-found: error
          retention-days: 14
