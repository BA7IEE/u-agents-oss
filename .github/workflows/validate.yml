name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      U_AGENTS_ALLOW_CODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare isolated configuration before Bun
        run: |
          candidate_config="$RUNNER_TEMP/u-agents-validate-config"
          candidate_claude="$RUNNER_TEMP/u-agents-validate-claude"
          mkdir -p "$candidate_config" "$candidate_claude"
          printf 'U_AGENTS_CONFIG_DIR=%s\nCRAFT_CONFIG_DIR=%s\nCLAUDE_CONFIG_DIR=%s\n' "$candidate_config" "$candidate_config" "$candidate_claude" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Reject Windows-illegal filenames
        run: |
          BAD=$(git ls-files | grep -E '[<>:"|?*]' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Files with characters illegal on Windows:"
            echo "$BAD"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run validation suite
        run: bun run validate:ci
