name: macOS Candidate

on:
  push:
    branches: [codex/upstream-v0.15.6]
    paths:
      - '.github/workflows/macos-candidate.yml'
      - '.github/scripts/**'
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      U_AGENTS_ALLOW_CODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare isolated configuration before Bun
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          profile="$RUNNER_TEMP/u-agents-candidate-config"
          claude_profile="$RUNNER_TEMP/u-agents-candidate-claude"
          mkdir -p "$profile" "$claude_profile"
          printf 'U_AGENTS_CONFIG_DIR=%s\nCRAFT_CONFIG_DIR=%s\nCLAUDE_CONFIG_DIR=%s\n' "$profile" "$profile" "$claude_profile" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - name: Build macOS arm64 test packages without publishing
        run: bash apps/electron/scripts/build-dmg.sh arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify package integrity and packaged runtimes
        run: |
          set -euo pipefail
          app='apps/electron/release/mac-arm64/U Agents.app'
          root="$app/Contents/Resources/app"
          codesign --verify --deep --strict "$app"
          test "$(lipo -archs "$app/Contents/MacOS/U Agents")" = arm64
          hdiutil verify apps/electron/release/U-Agents-arm64.dmg
          unzip -tq apps/electron/release/U-Agents-arm64.zip
          for asset in latest-mac.yml U-Agents-arm64.dmg.blockmap U-Agents-arm64.zip.blockmap; do
            test -s "apps/electron/release/$asset"
          done
          bun .github/scripts/verify-packaged-runtime.ts "$root" "$root/vendor/bun/bun" apps/electron/release/RUNTIME-CHECK.json
          (
            cd apps/electron/release
            shasum -a 256 U-Agents-arm64.dmg U-Agents-arm64.zip U-Agents-arm64.dmg.blockmap U-Agents-arm64.zip.blockmap latest-mac.yml > SHA256SUMS.txt
            cat > BUILD.txt <<EOF
          Commit: $GITHUB_SHA
          Version: 0.15.6
          Platform: macos-arm64
          Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Built without automatic publication; ad hoc signing; not notarized
          Real image generation: NOT_RUN (real paid requests not authorized for this candidate)
          EOF
          )
      - uses: actions/upload-artifact@v4
        with:
          name: U-Agents-0.15.6-macos-arm64
          path: |
            apps/electron/release/U-Agents-arm64.dmg
            apps/electron/release/U-Agents-arm64.zip
            apps/electron/release/U-Agents-arm64.dmg.blockmap
            apps/electron/release/U-Agents-arm64.zip.blockmap
            apps/electron/release/latest-mac.yml
            apps/electron/release/SHA256SUMS.txt
            apps/electron/release/BUILD.txt
            apps/electron/release/RUNTIME-CHECK.json
          if-no-files-found: error
          retention-days: 14
